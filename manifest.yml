# Backlink Atlas — what links to this page, and which links no longer land.
#
# Confluence does not keep a reverse index. There is no "inbound links" call in
# its REST API, which is why the request for one has been open since 2014. This
# app builds that index itself: it reads page bodies, extracts the links, and
# stores the edges — the ids, never the text.
#
# It runs entirely on Forge. Nothing leaves Atlassian: the manifest declares no
# external permissions at all, so the platform would refuse an outbound call
# even if the code attempted one.

app:
  id: ari:cloud:ecosystem::app/2beb7dcf-6bc6-4c40-8861-f5df230cf96c
  runtime:
    name: nodejs22.x
  storage:
    entities:
      - name: page
        attributes:
          spaceKey:
            type: string
          title:
            type: string
          titleFold:
            type: string
          version:
            type: integer
          inCount:
            type: integer
          outCount:
            type: integer
          brokenCount:
            type: integer
          indexedAt:
            type: integer
          anchors:
            type: any
          anchorsTruncated:
            type: boolean
        indexes:
          - name: by-space-title
            partition:
              - spaceKey
            range:
              - titleFold
          - name: by-space-incoming
            partition:
              - spaceKey
            range:
              - inCount
      - name: edge
        attributes:
          sourceId:
            type: string
          # Distinguishes this edge from the page's others. It is the same hash
          # the row's key ends with, kept as an attribute because the by-source
          # index needs a range and this is the only value certain to be
          # distinct within one page.
          slot:
            type: string
          sourceSpace:
            type: string
          sourceTitle:
            type: string
          targetRef:
            type: string
          targetTitle:
            type: string
          targetSpace:
            type: string
          anchor:
            type: string
          kind:
            type: string
          state:
            type: string
          hits:
            type: integer
          seenAt:
            type: integer
        indexes:
          - name: by-target
            partition:
              - targetRef
            range:
              - sourceId
          - name: by-source
            partition:
              - sourceId
            range:
              - slot
          - name: by-space-state
            partition:
              - sourceSpace
              - state
            range:
              - sourceId

permissions:
  scopes:
    # Page bodies, to read the links out of them.
    - read:page:confluence
    # Space names and keys, to say which space a finding is in.
    - read:space:confluence
    # The graph.
    - storage:app

modules:
  # "What links here", on the page itself. This is the 2014 request.
  macro:
    - key: backlinks-macro
      resource: main
      render: native
      resolver:
        function: resolver
      title: Backlinks
      description: Lists the pages that link to this one.

  # The same count, always visible in the page byline, without editing the page.
  confluence:contentBylineItem:
    - key: backlinks-byline
      resource: main
      render: native
      resolver:
        function: resolver
      title: Backlinks
      dynamicProperties:
        function: byline

  # The link health of one space: what is broken, what is orphaned.
  confluence:spacePage:
    - key: backlinks-space
      resource: main
      render: native
      resolver:
        function: resolver
      title: Link health
      # The path this page lives at inside a space, which the platform requires
      # a space page to name for itself.
      route: link-health

  # Site-wide settings and the indexing status.
  confluence:globalSettings:
    - key: backlinks-settings
      resource: main
      render: native
      resolver:
        function: resolver
      title: Backlink Atlas

  # A full sweep is far longer than one invocation allows, so it is a chain of
  # queued steps, each picking up at the cursor the last one left.
  consumer:
    - key: backlinks-crawl-queue
      queue: crawl
      resolver:
        function: crawlStep
        method: step

  scheduledTrigger:
    # The whole site, once a night. This is what finds links broken by a page
    # being renamed somewhere else, which nothing else can see.
    - key: backlinks-nightly
      function: startSweep
      interval: day

    # What changed in the last hour. Confluence will push page events to an app
    # that holds read:confluence-content.summary — a classic scope over the
    # summary of all content, with no granular equivalent. Three narrow
    # read-only scopes are most of why this app is worth installing, so it
    # reads the newest-edited pages instead of widening them.
    - key: backlinks-catchup
      function: catchUp
      interval: hour

  function:
    - key: resolver
      handler: index.handler
    - key: byline
      handler: index.byline
    - key: catchUp
      handler: index.catchUp
    - key: startSweep
      handler: index.startSweep
    - key: crawlStep
      handler: index.crawlStep

resources:
  - key: main
    path: src/frontend/index.jsx
